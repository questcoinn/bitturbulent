schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish
context: |
  changes/archive/는 과거 기록이므로 현재 결정의 근거로 쓰지 않는다. 현재 동작은 specs/를 기준으로 한다.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - 범위 밖인 것(Out of scope)을 반드시 명시한다
    - 관련 main specs를 먼저 찾고, 겹치거나 모순되는 requirement가 있으면 proposal에 명시한다
  specs:
    - 인터페이스와 데이터 구조는 산문으로 풀어 쓰지 않고 스키마 파일(JSON Schema, OpenAPI, Protobuf 등)을 참조한다
    - 다른 spec에 이미 있는 규칙은 복사하지 않고 해당 spec을 참조한다
  tasks:
    - 테스트 작성 task를 해당 구현 task보다 먼저 배치한다
    - change 하나의 task는 10개 이하로 유지하고, 넘으면 change를 나눈다

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - '커밋 메시지에 change 이름을 포함한다 (예: "feat(add-dark-mode): 토글 버튼 추가")'
  archive:
    guidance:
      - 미완료 task가 남은 채 archive할 때는 각 미완료 task 옆에 남긴 이유와 후속 change 이름(없으면 "후속 없음")을 적는다
